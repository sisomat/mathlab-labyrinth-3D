      box(0.48, 1.0, 0.48, legMat, 0, -0.5, 0, piv);
      box(0.5, 0.22, 0.65, shoe, 0, -0.92, 0.07, piv);
      return piv;
    };
    root.userData = {
      radius: 1.2, model, mats,
      armL: mkArm(-0.75), armR: mkArm(0.75),
      legL: mkLeg(-0.28), legR: mkLeg(0.28)
    };
    return root;
  }

  function animatePlayer(mx, mz, delta) {
    const u = playerMesh.userData;
    const moving = (mx !== 0 || mz !== 0);
    if (moving) {
      // Menghadap arah gerak (putar halus)
      const target = Math.atan2(mx, mz);
      let diff = target - playerMesh.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      playerMesh.rotation.y += diff * Math.min(1, delta * 14);
      walkPhase += delta * 11;
      const sw = Math.sin(walkPhase) * 0.85;
      u.legL.rotation.x = sw;  u.legR.rotation.x = -sw;
      u.armL.rotation.x = -sw; u.armR.rotation.x = sw;
      u.model.position.y = Math.abs(Math.sin(walkPhase)) * 0.12;
    } else {
      const k = Math.min(1, delta * 12);
      u.legL.rotation.x *= (1 - k); u.legR.rotation.x *= (1 - k);
      u.armL.rotation.x *= (1 - k); u.armR.rotation.x *= (1 - k);
      u.model.position.y *= (1 - k);
    }
  }

  function setPlayerOpacity(op) {
    playerMesh.userData.mats.forEach(m => { m.transparent = op < 1; m.opacity = op; });
  }
  let wallsData = [];
  let portalsData = [];
  let enemiesData = [];
  let cameraShake = 0;
  let playerInvulnerable = 0;

  // --- PEMBUATAN LABIRIN ---
  function generateMazeGrid(size) {
    let grid = Array(size).fill().map(() => Array(size).fill(1)); 
    
    function carve(x, y) {
      grid[y][x] = 0;
      const dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(() => Math.random() - 0.5);
      for(let [dx, dy] of dirs) {
        let nx = x + dx, ny = y + dy;
        if(nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && grid[ny][nx] === 1) {
          grid[y + dy/2][x + dx/2] = 0;
          carve(nx, ny);
        }
      }
    }
    carve(Math.floor(size/2), Math.floor(size/2));

    // Buka 4 pojok untuk portal
    grid[1][1] = 0; grid[1][2] = 0; grid[2][1] = 0;
    grid[size-2][size-2] = 0; grid[size-2][size-3] = 0; grid[size-3][size-2] = 0;
    grid[1][size-2] = 0; grid[1][size-3] = 0; grid[2][size-2] = 0;
    grid[size-2][1] = 0; grid[size-2][2] = 0; grid[size-3][1] = 0;
    
    // Perlebar area tengah jadi 3x3 agar tidak nyangkut saat spawn
    let c = Math.floor(size/2);
    for(let dy=-1; dy<=1; dy++) {
      for(let dx=-1; dx<=1; dx++) {
        grid[c+dy][c+dx] = 0;
      }
    }
    return grid;
  }

  function createSpikedBall(colorHex) {
    const group = new THREE.Group();
    const s = gameState.cellSize;
    const coreGeo = new THREE.SphereGeometry(s*0.25, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.2 });
    
    const core = new THREE.Mesh(coreGeo, mat);
    group.add(core);

    const spikeGeo = new THREE.ConeGeometry(s*0.06, s*0.25, 8);
    const positions = [
        [0, s*0.25, 0, 0, 0, 0], [0, -s*0.25, 0, Math.PI, 0, 0],
        [s*0.25, 0, 0, 0, 0, -Math.PI/2], [-s*0.25, 0, 0, 0, 0, Math.PI/2],
        [0, 0, s*0.25, Math.PI/2, 0, 0], [0, 0, -s*0.25, -Math.PI/2, 0, 0]
    ];
    positions.forEach(pos => {
        const spike = new THREE.Mesh(spikeGeo, mat);
        spike.position.set(pos[0], pos[1], pos[2]);
        spike.rotation.set(pos[3], pos[4], pos[5]);
        group.add(spike);
    });
    
    // Lampu agar musuh terlihat mengancam
    const light = new THREE.PointLight(colorHex, 1, s*2);
    group.add(light);
    
    return group;
  }

  function buildLevel3D(isLobby = false) {
    while(levelGroup.children.length > 0) { 
      levelGroup.remove(levelGroup.children[0]); 
    }
    wallsData = []; portalsData = []; enemiesData = []; fruitsData = []; cageData = null; playerFlight = null; keyItem = null; targetPosition = null;

    let s = gameState.cellSize;
    currentMazeGrid = generateMazeGrid(gameState.mazeSize);
    let offset = (gameState.mazeSize * s) / 2;

    const floorGeo = new THREE.PlaneGeometry(gameState.mazeSize * s, gameState.mazeSize * s);
    floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.set(offset - s/2, 0, offset - s/2);
    levelGroup.add(floorMesh);
    buildScenery(offset - s/2, offset - s/2, offset);

    const boxGeo = new THREE.BoxGeometry(s, s*1.5, s);
    for(let y=0; y<gameState.mazeSize; y++) {
      for(let x=0; x<gameState.mazeSize; x++) {
        if(currentMazeGrid[y][x] === 1) {
          let mesh = new THREE.Mesh(boxGeo, wallMat);
          mesh.position.set(x * s, s*0.75, y * s);
          levelGroup.add(mesh);
          wallsData.push({ minX: (x*s)-s/2, maxX: (x*s)+s/2, minZ: (y*s)-s/2, maxZ: (y*s)+s/2 });
        }
      }
    }

    if(!isLobby) {
      let center = Math.floor(gameState.mazeSize/2);
      
      // Avatar: Penjelajah Cilik (karakter blok orisinal)
      playerMesh = createExplorer(selectedChar);
      const shieldBubble = new THREE.Mesh(
        new THREE.SphereGeometry(2.4, 20, 16),
        new THREE.MeshBasicMaterial({ color: 0x60d0ff, transparent: true, opacity: 0.28, depthWrite: false })
      );
      shieldBubble.position.y = 1.7; shieldBubble.visible = false;
      playerMesh.add(shieldBubble);
      playerMesh.userData.shield = shieldBubble;
      playerMesh.position.set(center * s, 0, center * s);
      levelGroup.add(playerMesh);
      const ballRadius = 0;

      playerLight = new THREE.PointLight(0x60a5fa, 1.5, s*3);
      playerLight.position.set(center * s, ballRadius, center * s);
      levelGroup.add(playerLight);

      // Portal Magis di 4 Pojok
      const portalLocs = [
        {x: 1, z: 1, color: 0xf59e0b, val: gameState.options[0]}, 
        {x: gameState.mazeSize-2, z: 1, color: 0x3b82f6, val: gameState.options[1]},
        {x: 1, z: gameState.mazeSize-2, color: 0xec4899, val: gameState.options[2]}, 
        {x: gameState.mazeSize-2, z: gameState.mazeSize-2, color: 0x10b981, val: gameState.options[3]} 
      ];

      const torusGeo = new THREE.TorusGeometry(s*0.4, 0.08, 16, 50);
      portalLocs.forEach(p => {
        const pMat = new THREE.MeshBasicMaterial({ color: p.color, wireframe: true });
        const pMesh1 = new THREE.Mesh(torusGeo, pMat);
        const pMesh2 = new THREE.Mesh(torusGeo, pMat);
        pMesh2.rotation.x = Math.PI/2;
        
        let pGrp = new THREE.Group();
        pGrp.position.set(p.x * s, s*0.6, p.z * s);
        pGrp.add(pMesh1); pGrp.add(pMesh2);
        levelGroup.add(pGrp);

        const pLight = new THREE.PointLight(p.color, 2, s*2);
        pGrp.add(pLight);

        // Label Angka (Lebih fleksibel ukurannya untuk Pecahan)
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#'+p.color.toString(16);
        
        let valStr = p.val.toString();
        const vl = valStr.length;
        let fontSize = vl <= 4 ? 70 : vl === 5 ? 60 : vl === 6 ? 52 : vl === 7 ? 46 : 40;
        ctx.font = `bold ${fontSize}px Arial`; 
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(valStr, 128, 64);
        
        const tex = new THREE.CanvasTexture(canvas);
        const lblMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const lblSprite = new THREE.Sprite(lblMat);
        lblSprite.position.set(0, s*0.7, 0);
        lblSprite.scale.set(s * 1.8, s * 0.9, 1);
        pGrp.add(lblSprite);

        portalsData.push({ 
          x: p.x * s, z: p.z * s, val: p.val, 
          mesh1: pMesh1, mesh2: pMesh2, radius: s*0.6 
        });
      });

      // Spawn 3 Musuh Berduri (Merah, Kuning, Hijau)
      let emptySpots = [];
      for(let y=1; y<gameState.mazeSize-1; y++) {
        for(let x=1; x<gameState.mazeSize-1; x++) {
           // Hindari spawn dekat pusat
           if(currentMazeGrid[y][x] === 0 && (Math.abs(x - center) > 2 || Math.abs(y - center) > 2)) {
               emptySpots.push({x, y});
           }
        }
      }
      emptySpots.sort(() => Math.random() - 0.5); 

      const enemyTypes = [
        { color: 0xff0000, dmg: 5, speed: s * 1.5 }, // Merah
        { color: 0xffff00, dmg: 3, speed: s * 1.2 }, // Kuning
        { color: 0x00ff00, dmg: 1, speed: s * 0.9 }  // Hijau
      ];

      enemyTypes.forEach((type) => {
          if(emptySpots.length > 0) {
             let spot = emptySpots.pop();
             let mesh = createSpikedBall(type.color);
             mesh.position.set(spot.x * s, s*0.35, spot.y * s);
             levelGroup.add(mesh);
             
             let angle = Math.random() * Math.PI * 2;
             enemiesData.push({
                 mesh: mesh, x: spot.x * s, z: spot.y * s,
                 vx: Math.cos(angle) * type.speed, vz: Math.sin(angle) * type.speed,
                 dmg: type.dmg, radius: s * 0.35, colorHex: type.color
             });
          }
      });

      // Buah-buahan (kadang muncul di jalan labirin)
      const nearPortal = (x, y) => [[1,1],[gameState.mazeSize-2,1],[1,gameState.mazeSize-2],[gameState.mazeSize-2,gameState.mazeSize-2]]
        .some(([px,py]) => Math.abs(x-px) + Math.abs(y-py) < 3);
      // Kandang ayam (misi utama): diletakkan di ujung jalan buntu agar tidak menutup jalur labirin
      const openNb = (x, y) => [[1,0],[-1,0],[0,1],[0,-1]]
        .filter(([ddx, ddy]) => currentMazeGrid[y + ddy] && currentMazeGrid[y + ddy][x + ddx] === 0)
        .map(([ddx, ddy]) => ({ x: x + ddx, y: y + ddy, dx: ddx, dy: ddy }));
      const enemyCell = (x, y) => enemiesData.some(en => Math.round(en.x / s) === x && Math.round(en.z / s) === y);
      const isOpen = (x, y) => currentMazeGrid[y] && currentMazeGrid[y][x] === 0;
      const portalCells = [[1,1],[gameState.mazeSize-2,1],[1,gameState.mazeSize-2],[gameState.mazeSize-2,gameState.mazeSize-2]];
      // Sel yang bisa dijangkau dari titik awal bila sel (bx,by) ditutup kandang
      const reachWithout = (bx, by) => {
        const seen = new Set([center + ',' + center]), q = [[center, center]];
        while (q.length) {
          const [qx, qy] = q.shift();
          openNb(qx, qy).forEach(n => {
            const k = n.x + ',' + n.y;
            if (!seen.has(k) && !(n.x === bx && n.y === by)) { seen.add(k); q.push([n.x, n.y]); }
          });
        }
        return seen;
      };
      // Kandang aman = tidak memutus jalan ke portal & punya sisi yang bisa dijangkau pemain
      const cageSafe = (x, y) => {
        const r = reachWithout(x, y);
        return portalCells.every(([px, py]) => r.has(px + ',' + py)) && openNb(x, y).some(n => r.has(n.x + ',' + n.y));
      };
      const cands = [];
      for (let yy = 1; yy < gameState.mazeSize - 1; yy++) {
        for (let xx = 1; xx < gameState.mazeSize - 1; xx++) {
          if (isOpen(xx, yy) && !nearPortal(xx, yy) && !enemyCell(xx, yy) && (Math.abs(xx - center) > 1 || Math.abs(yy - center) > 1)) cands.push({ x: xx, y: yy });
        }
      }
      const far = (sp) => (Math.abs(sp.x - center) + Math.abs(sp.y - center)) >= 4;
      const isDead = (sp) => openNb(sp.x, sp.y).length === 1;
      let cagePool = cands.filter(sp => isDead(sp) && far(sp));                       // ujung buntu & jauh
      if (!cagePool.length) cagePool = cands.filter(isDead);                          // ujung buntu mana saja
      if (!cagePool.length) cagePool = cands.filter(sp => far(sp) && cageSafe(sp.x, sp.y)); // sel lain yang aman
      if (!cagePool.length) cagePool = cands.filter(sp => cageSafe(sp.x, sp.y));
      let cageSolid = true;
      if (!cagePool.length) { // cadangan (praktis tidak pernah): jangan jadikan penghalang
        cageSolid = false;
        cagePool = cands.length ? cands : emptySpots;
      }
      if (cagePool.length) {
        const cs = cagePool[Math.floor(Math.random() * cagePool.length)];
        const ci = emptySpots.findIndex(sp => sp.x === cs.x && sp.y === cs.y);
        if (ci >= 0) emptySpots.splice(ci, 1);
        cageData = createCage();
        cageData.x = cs.x * s; cageData.z = cs.y * s;
        cageData.group.position.set(cageData.x, 0, cageData.z);

        // Pintu kandang menghadap jalan keluar; jalur lari ayam menyusuri lorong (maks. 3 petak)
        const reachable = reachWithout(cs.x, cs.y);
        let exits = openNb(cs.x, cs.y).filter(n => reachable.has(n.x + ',' + n.y));
        if (!exits.length) exits = openNb(cs.x, cs.y);
        let path = [{ x: cageData.x, z: cageData.z }];
        if (exits.length) {
          const e0 = exits[0];
          cageData.group.rotation.y = Math.atan2(e0.dx, e0.dy);
          let prev = cs, cur = e0;
          for (let i = 0; i < 3 && cur; i++) {
            path.push({ x: cur.x * s, z: cur.y * s });
            const nexts = openNb(cur.x, cur.y).filter(n => !(n.x === prev.x && n.y === prev.y));
            prev = cur; cur = nexts[0];
          }
        } else {
          path.push({ x: cageData.x, z: cageData.z + s * 2 });
        }
        cageData.path = path;
        levelGroup.add(cageData.group);

        // Kandang padat: karakter & bola berduri tidak bisa menembus
        if (cageSolid) {
          const hw = 1.8;
          wallsData.push({ minX: cageData.x - hw, maxX: cageData.x + hw, minZ: cageData.z - hw, maxZ: cageData.z + hw });
        }
      }
      const fruitSpots = emptySpots.filter(sp => !nearPortal(sp.x, sp.y));
      ['banana', 'apple', 'orange'].forEach(type => {
        if (Math.random() < 0.55 && fruitSpots.length > 0) {
          const sp = fruitSpots.pop();
          const fm = createFruit(type);
          fm.position.set(sp.x * s, 1.4, sp.y * s);
          levelGroup.add(fm);
          fruitsData.push({ type, mesh: fm, x: sp.x * s, z: sp.y * s, baseY: 1.4, phase: Math.random() * 6 });
        }
      });


      drawMinimapBackground();
    }
  }

  // --- MINIMAP LOGIC ---
  function drawMinimapBackground() {
    const cvs = document.getElementById('minimap-bg');
    if(!cvs) return;
    const ctx = cvs.getContext('2d');
    const size = gameState.mazeSize;
    cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
    const cellW = cvs.width / size;
    const cellH = cvs.height / size;

    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    ctx.fillStyle = 'rgba(34, 139, 34, 0.8)'; // Hijau daun
    for(let y=0; y<size; y++) {
      for(let x=0; x<size; x++) {
        if(currentMazeGrid[y][x] === 1) {
          ctx.fillRect(x * cellW, y * cellH, cellW+0.5, cellH+0.5); 
        }
      }
    }
    
    const portalColors = ['#f59e0b', '#3b82f6', '#ec4899', '#10b981'];
    const pLocs = [{x: 1, y: 1}, {x: size-2, y: 1}, {x: 1, y: size-2}, {x: size-2, y: size-2}];
    if(portalsData.length) pLocs.forEach((p, i) => {
       ctx.fillStyle = portalColors[i];
       ctx.beginPath();
       ctx.arc(p.x * cellW + cellW/2, p.y * cellH + cellH/2, cellW/2.5, 0, Math.PI*2);
       ctx.fill();
    });
  }

  function updateMinimapPlayer() {
    if(!playerMesh) return;
    // Putar peta agar "atas" peta = arah depan layar (kamera)
    const rotor = document.getElementById('minimap-rotor');
    if(rotor) rotor.style.transform = `rotate(${cameraAngleOffset}rad) scale(0.82)`;
    const cvs = document.getElementById('minimap-player');
    if(!cvs) return;
    const ctx = cvs.getContext('2d');
    const size = gameState.mazeSize;
    cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
    const cellW = cvs.width / size;
    
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    // Player
    const mapX = (playerMesh.position.x / gameState.cellSize) * cellW + (cellW/2);
    const mapZ = (playerMesh.position.z / gameState.cellSize) * (cvs.height/size) + (cvs.height/size/2);

    ctx.fillStyle = '#60a5fa';
    ctx.beginPath();
    ctx.arc(mapX, mapZ, cellW/2, 0, Math.PI*2);
    ctx.fill();

    // Panah arah hadap karakter
    const fdx = Math.sin(playerMesh.rotation.y), fdz = Math.cos(playerMesh.rotation.y);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(mapX + fdx * cellW * 1.0, mapZ + fdz * cellW * 1.0);
    ctx.lineTo(mapX - fdx * cellW * 0.1 - fdz * cellW * 0.45, mapZ - fdz * cellW * 0.1 + fdx * cellW * 0.45);
    ctx.lineTo(mapX - fdx * cellW * 0.1 + fdz * cellW * 0.45, mapZ - fdz * cellW * 0.1 - fdx * cellW * 0.45);
    ctx.closePath();
    ctx.fill();

    // Musuh
    enemiesData.forEach(e => {
        const eMapX = (e.mesh.position.x / gameState.cellSize) * cellW + (cellW/2);
        const eMapZ = (e.mesh.position.z / gameState.cellSize) * (cvs.height/size) + (cvs.height/size/2);
        ctx.fillStyle = '#' + e.colorHex.toString(16).padStart(6, '0');
        ctx.beginPath();
        ctx.arc(eMapX, eMapZ, cellW/2.5, 0, Math.PI*2);
        ctx.fill();
    });
    // Kunci berputar (berdenyut)
    if (keyItem) {
        const kx = (keyItem.x / gameState.cellSize) * cellW + (cellW/2);
        const kz = (keyItem.z / gameState.cellSize) * (cvs.height/size) + (cvs.height/size/2);
        const pulse = 1 + Math.sin(performance.now() * 0.008) * 0.25;
        ctx.fillStyle = '#ffd54a';
        ctx.beginPath(); ctx.arc(kx, kz, cellW/2.2 * pulse, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(kx, kz, cellW/1.6 * pulse, 0, Math.PI*2); ctx.stroke();
    }


    // Buah
    const fruitColors = { banana: '#ffe135', apple: '#e02424', orange: '#ff8a1c' };
    fruitsData.forEach(f => {
        const fx = (f.x / gameState.cellSize) * cellW + (cellW/2);
        const fz = (f.z / gameState.cellSize) * (cvs.height/size) + (cvs.height/size/2);
        ctx.fillStyle = fruitColors[f.type];
        ctx.beginPath();
        ctx.arc(fx, fz, cellW/3, 0, Math.PI*2);
        ctx.fill();
    });

    // Kandang ayam
    if (cageData && cageData.state === 'locked') {
        const kx = (cageData.x / gameState.cellSize) * cellW + (cellW/2);
        const kz = (cageData.z / gameState.cellSize) * (cvs.height/size) + (cvs.height/size/2);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(kx - cellW/2.2, kz - cellW/2.2, cellW/1.1, cellW/1.1);
        ctx.fillStyle = '#e53935';
        ctx.fillRect(kx - cellW/5, kz - cellW/5, cellW/2.5, cellW/2.5);
    }
  }

  // --- KONTROL & EVENT LISTENER ---
  
  window.addEventListener('keydown', e => {
    if(!gameState.isPlaying) return;
    if(e.key==='ArrowUp' || e.key==='w') keys.up = true;
    if(e.key==='ArrowDown' || e.key==='s') keys.down = true;
    if(e.key==='ArrowLeft' || e.key==='a') keys.left = true;
    if(e.key==='ArrowRight' || e.key==='d') keys.right = true;
  });
  window.addEventListener('keyup', e => {
    if(e.key==='ArrowUp' || e.key==='w') keys.up = false;
    if(e.key==='ArrowDown' || e.key==='s') keys.down = false;
    if(e.key==='ArrowLeft' || e.key==='a') keys.left = false;
    if(e.key==='ArrowRight' || e.key==='d') keys.right = false;
  });

  // Kamera Putar (Swipe/Drag) dan Tap-To-Move Terpadu
  renderer.domElement.addEventListener('pointerdown', (e) => {
    if(!gameState.isPlaying || joyActive) return;
    isDraggingCam = true;
    dragStartPt = { x: e.clientX, y: e.clientY };
    dragLastPt = { x: e.clientX, y: e.clientY };
  });

  renderer.domElement.addEventListener('pointermove', (e) => {
    if(!gameState.isPlaying || !isDraggingCam) return;
    let dx = e.clientX - dragLastPt.x;
    let dy = e.clientY - dragLastPt.y;
    
    // Jika digeser lebih dari 5 piksel, itu adalah "Swipe", putar kamera
    if (Math.abs(e.clientX - dragStartPt.x) > 5 || Math.abs(e.clientY - dragStartPt.y) > 5) {
      targetPosition = null; 
      cameraAngleOffset -= dx * 0.006; // Sensitivitas geser horizontal
      cameraPitchOffset -= dy * 0.006; // Sensitivitas geser vertikal
      
      // Batasi sudut vertikal agar tidak melihat ke bawah lantai atau terlalu ke atas
      cameraPitchOffset = Math.max(0.15, Math.min(Math.PI / 2 - 0.1, cameraPitchOffset));
    }
    dragLastPt = { x: e.clientX, y: e.clientY };
  });

  renderer.domElement.addEventListener('pointerup', (e) => {
    if(!gameState.isPlaying || !isDraggingCam) return;
    isDraggingCam = false;
    
    // Jika jarinya hampir tidak bergeser, itu adalah "Tap/Klik", karakter akan berjalan
    if (Math.abs(e.clientX - dragStartPt.x) <= 5 && Math.abs(e.clientY - dragStartPt.y) <= 5) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1; 
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(floorMesh);
      if (intersects.length > 0) {
        targetPosition = intersects[0].point;
        if (playerMesh) targetPosition.y = playerMesh.position.y;
      }
    }
  });

  renderer.domElement.addEventListener('pointerleave', () => { isDraggingCam = false; });

  // Virtual Joystick
  const joyZone = document.getElementById('joystick-zone');
  const joyKnob = document.getElementById('joystick-knob');
  let joyActive = false;
  let joyCenter = { x: 0, y: 0 };
  const maxJoyRadius = 40;

  function handleJoyStart(e) {
    if(!gameState.isPlaying) return;
    e.preventDefault(); e.stopPropagation();
    joyActive = true; targetPosition = null; 
    const rect = joyZone.getBoundingClientRect();
    joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    updateJoy(e);
  }

  function handleJoyMove(e) {
    if (!joyActive) return;
    e.preventDefault(); e.stopPropagation();
    updateJoy(e);
  }

  function handleJoyEnd(e) {
    if (!joyActive) return;
    e.preventDefault(); e.stopPropagation();
    joyActive = false; joyVector = { x: 0, y: 0 };
    joyKnob.style.transform = `translate(-50%, -50%)`;
  }

  function updateJoy(e) {
    let clientX = e.clientX; let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
    }
    let dx = clientX - joyCenter.x; let dy = clientY - joyCenter.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    let knobX = dx, knobY = dy;
    if (dist > maxJoyRadius) { knobX = (dx / dist) * maxJoyRadius; knobY = (dy / dist) * maxJoyRadius; }
    
    joyVector.x = knobX / maxJoyRadius; joyVector.y = knobY / maxJoyRadius;
    joyKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
  }

  joyZone.addEventListener('mousedown', handleJoyStart);
  window.addEventListener('mousemove', handleJoyMove);
  window.addEventListener('mouseup', handleJoyEnd);
  joyZone.addEventListener('touchstart', handleJoyStart, {passive: false});
  window.addEventListener('touchmove', handleJoyMove, {passive: false});
  window.addEventListener('touchend', handleJoyEnd);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if(gameState.isPlaying) drawMinimapBackground(); 
  });

  // --- LOGIKA TABRAKAN (AABB) ---
  function checkCollision(px, pz, radius) {
    for(let w of wallsData) {
      if(px + radius > w.minX && px - radius < w.maxX && pz + radius > w.minZ && pz - radius < w.maxZ) {
        return true; 
      }
    }
    return false;
  }

  // --- ANIMATION LOOP ---
  const clock = new THREE.Clock();
  
  function animate() {
    requestAnimationFrame(animate);
    let delta = Math.min(clock.getDelta(), 0.05);

    if(gameState.isPlaying && playerMesh && !levelPause) {
      let speed = gameState.cellSize * 3.5 * delta; 
      let pRadius = playerMesh.userData.radius; 
      
      let moveX = 0, moveZ = 0;
      const flying = !!playerFlight;
      let isManual = !flying && (keys.up || keys.down || keys.left || keys.right || joyVector.x !== 0 || joyVector.y !== 0);

      if (isManual) {
        targetPosition = null;
        let inputX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0) + joyVector.x;
        let inputZ = (keys.down ? 1 : 0) - (keys.up ? 1 : 0) + joyVector.y;
        
        let len = Math.sqrt(inputX*inputX + inputZ*inputZ);
        if(len > 1) { inputX /= len; inputZ /= len; }

        // Pergerakan Relatif thd Sudut Kamera (Penting agar joystick selalu selaras dengan view)
        let s = Math.sin(cameraAngleOffset);
        let c = Math.cos(cameraAngleOffset);
        
        moveX = (inputX * c + inputZ * s) * speed;
        moveZ = (-inputX * s + inputZ * c) * speed;
      } 
      else if (!flying && targetPosition) {
        let dx = targetPosition.x - playerMesh.position.x;
        let dz = targetPosition.z - playerMesh.position.z;
        let dist = Math.sqrt(dx*dx + dz*dz);
        if (dist > speed) {
          moveX = (dx / dist) * speed;
          moveZ = (dz / dist) * speed;
        } else {
          targetPosition = null;
        }
      }

      // Sliding Wall Collision
      let actualMoveX = 0, actualMoveZ = 0;
      if (moveX !== 0) {
        if (!checkCollision(playerMesh.position.x + moveX, playerMesh.position.z, pRadius)) {
          playerMesh.position.x += moveX; actualMoveX = moveX;
        } else targetPosition = null; 
      }
      if (moveZ !== 0) {
        if (!checkCollision(playerMesh.position.x, playerMesh.position.z + moveZ, pRadius)) {
          playerMesh.position.z += moveZ; actualMoveZ = moveZ;
        } else targetPosition = null;
      }

      // Animasi berjalan & menghadap arah gerak
      if (!flying) animatePlayer(actualMoveX, actualMoveZ, delta);

      // Terbang ke atas lalu turun di posisi tengah (setelah jawaban salah)
      if (playerFlight) {
        const f = playerFlight, pu = playerMesh.userData;
        f.t += delta;
        const H = 26, T1 = 0.5, T2 = 1.0, T3 = 1.6;
        if (f.t < T1) {
          const k = f.t / T1;
          playerMesh.position.set(f.sx, H * (1 - (1 - k) * (1 - k)), f.sz);
        } else if (f.t < T2) {
          const k = (f.t - T1) / (T2 - T1), e = k * k * (3 - 2 * k);
          playerMesh.position.set(f.sx + (f.cx - f.sx) * e, H, f.sz + (f.cz - f.sz) * e);
        } else if (f.t < T3) {
          const k = (f.t - T2) / (T3 - T2);
          playerMesh.position.set(f.cx, H * (1 - k * k), f.cz);
        } else {
          playerMesh.position.set(f.cx, 0, f.cz);
          playerFlight = null; playerInvulnerable = 1.2; cameraShake = Math.max(cameraShake, 0.3); playBeep('start');
        }
        if (playerFlight) {
          playerMesh.rotation.y += 9 * delta;
          pu.armL.rotation.x = -2.8 + Math.sin(f.t * 22) * 0.35; pu.armR.rotation.x = -2.8 - Math.sin(f.t * 22) * 0.35;
          pu.legL.rotation.x = Math.sin(f.t * 18) * 0.6;        pu.legR.rotation.x = -Math.sin(f.t * 18) * 0.6;
          pu.model.position.y = 0;
        }
      }

      playerLight.position.set(playerMesh.position.x, playerMesh.position.y + 2.5, playerMesh.position.z);

      // Cek Portal
      for(let p of portalsData) {
        p.mesh1.rotation.y += 2 * delta;
        p.mesh2.rotation.y -= 1.5 * delta;
        p.mesh1.rotation.z += 1 * delta;
        
        let dx = playerMesh.position.x - p.x;
        let dz = playerMesh.position.z - p.z;
        if(!playerFlight && Math.sqrt(dx*dx + dz*dz) < p.radius) {
          if(p.val === gameState.correctAnswer) {
            playBeep('win'); showFeedback("BENAR!", true);
            // Semua portal lenyap; sebuah kunci berputar muncul & harus diambil dulu
            portalsData.forEach(q => { if (q.mesh1.parent) levelGroup.remove(q.mesh1.parent); });
            portalsData = [];
            hasKey = false;
            spawnKey();
            document.getElementById('ui-question-label').innerText = 'Misi:';
            document.getElementById('ui-question').innerText = '🔑 Ambil kuncinya!';
            if(isQuestionMinimized) toggleQuestion();
            showToast('✨ Kunci muncul! Cari dan ambil kunci yang berputar');
            updateStatus(); drawMinimapBackground();
          } else {
            playBeep('wrong'); showFeedback("SALAH!", false);
            gameState.hp -= 20; gameState.wrong++; cameraShake = 0.6;
            
            const dmgOverlay = document.getElementById('damage-overlay');
            dmgOverlay.classList.add('active');
            setTimeout(() => dmgOverlay.classList.remove('active'), 300);

            updateUI();
            
            if(gameState.wrong >= WRONG_LIMIT) return gameOver('wrong');
            if(gameState.hp <= 0) return gameOver('hp');
            else {
              showToast(`✖ Salah ${gameState.wrong}/${WRONG_LIMIT} — sisa kesempatan ${WRONG_LIMIT - gameState.wrong}`);
              // Terbang ke atas, lalu turun kembali di posisi tengah
              let center = Math.floor(gameState.mazeSize/2);
              playerFlight = { t: 0, sx: playerMesh.position.x, sz: playerMesh.position.z,
                               cx: center * gameState.cellSize, cz: center * gameState.cellSize };
              targetPosition = null;
            }
          }
          break;
        }
      }

      // Cek Musuh
      for(let e of enemiesData) {
        if(e.dead) continue;
        let nextX = e.mesh.position.x + e.vx * delta;
        let nextZ = e.mesh.position.z + e.vz * delta;

        if(checkCollision(nextX, e.mesh.position.z, e.radius)) { e.vx *= -1; nextX = e.mesh.position.x + e.vx * delta; }
        if(checkCollision(e.mesh.position.x, nextZ, e.radius)) { e.vz *= -1; nextZ = e.mesh.position.z + e.vz * delta; }

        e.mesh.position.x = nextX; e.mesh.position.z = nextZ;

        let rollSpeed = 1 / e.radius;
        e.mesh.rotation.x += e.vz * delta * rollSpeed;
        e.mesh.rotation.z -= e.vx * delta * rollSpeed;

        if(playerInvulnerable <= 0 && !playerFlight) {
            let dx = playerMesh.position.x - e.mesh.position.x;
            let dz = playerMesh.position.z - e.mesh.position.z;
            if(Math.sqrt(dx*dx + dz*dz) < (pRadius + e.radius)) {
                if (orangePower) { // Jeruk: hancurkan bola yang ditabrak
                    orangePower = false; e.dead = true; levelGroup.remove(e.mesh);
                    playBeep('win'); showToast('🍊 Bola hancur!'); updateStatus();
                    cameraShake = 0.3; playerInvulnerable = 0.4;
                    continue;
                }
                if (shieldHits > 0) { // Apel: tameng menahan tabrakan
                    shieldHits--; playBeep('start'); showToast('🛡️ Tameng menahan tabrakan!'); updateStatus();
                    playerInvulnerable = 1.0; cameraShake = 0.2;
                    continue;
                }
                playBeep('wrong');
                gameState.hp -= e.dmg;
                playerInvulnerable = 1.0; cameraShake = 0.6; 
                
                const dmgOverlay = document.getElementById('damage-overlay');
                dmgOverlay.classList.add('active');
                setTimeout(() => dmgOverlay.classList.remove('active'), 300);

                updateUI();
                if(gameState.hp <= 0) return gameOver('hp');
            }
        }
      }

      // Buah: berputar, melayang, dan bisa dimakan
      enemiesData = enemiesData.filter(x => !x.dead);
      const tNow = performance.now() * 0.003;
      for (let i = fruitsData.length - 1; i >= 0; i--) {
        const f = fruitsData[i];
        f.mesh.rotation.y += 2 * delta;
        f.mesh.position.y = f.baseY + Math.sin(tNow * 1.6 + f.phase) * 0.25;
        const fdx = playerMesh.position.x - f.x, fdz = playerMesh.position.z - f.z;
        if (!playerFlight && Math.sqrt(fdx*fdx + fdz*fdz) < pRadius + 0.9) {
          collectFruit(f.type);
          levelGroup.remove(f.mesh);
          fruitsData.splice(i, 1);
        }
      }
      const shBubble = playerMesh.userData.shield;
      if (shBubble) { shBubble.visible = shieldHits > 0; shBubble.scale.setScalar(1 + Math.sin(tNow * 3) * 0.04); }

      // Kunci berputar: melayang, berputar, dan bisa diambil
      if (keyItem) {
        const ku = keyItem.mesh.userData;
        ku.body.rotation.y += 3.2 * delta;
        ku.body.position.y = 2.1 + Math.sin(tNow * 1.6 + keyItem.phase) * 0.3;
        ku.ring.scale.setScalar(1 + Math.sin(tNow * 3) * 0.08);
        const kdx = playerMesh.position.x - keyItem.x, kdz = playerMesh.position.z - keyItem.z;
        if (!playerFlight && Math.sqrt(kdx*kdx + kdz*kdz) < pRadius + 1.3) {
          levelGroup.remove(keyItem.mesh); keyItem = null;
          hasKey = true;
          playBeep('win');
          document.getElementById('ui-question-label').innerText = 'Misi:';
          document.getElementById('ui-question').innerText = '🐔 Bawa kunci ke kandang!';
          showToast('🔑 Kunci didapat! Bawa ke kandang ayam');
          updateStatus();
        }
      }

      // Kandang ayam: ayam mematuk, kunci membuka, ayam diselamatkan
      if (cageData) {
        const cd = cageData;
        const cdx = playerMesh.position.x - cd.x, cdz = playerMesh.position.z - cd.z;
        const cdist = Math.sqrt(cdx*cdx + cdz*cdz);
        if (cd.state === 'locked') {
          cd.chicken.rotation.y = Math.sin(tNow * 1.3) * 0.5;
          cd.head.rotation.x = Math.max(0, Math.sin(tNow * 4)) * 0.7;
          if (cd.toastCd > 0) cd.toastCd -= delta;
          if (!playerFlight && cdist < pRadius + 2.5) {
            if (hasKey) {
              hasKey = false; cd.state = 'opening'; cd.t = 0;
              // Ayam dilepas ke dunia & berlari jauh menyusuri lorong
              cd.group.remove(cd.chicken);
              cd.chicken.position.set(cd.x, 0.2, cd.z);
              levelGroup.add(cd.chicken);
              let tot = 0;
              for (let i = 1; i < cd.path.length; i++) tot += Math.hypot(cd.path[i].x - cd.path[i-1].x, cd.path[i].z - cd.path[i-1].z);
              cd.runLen = tot; cd.runDur = Math.max(1.4, tot / 6.5);
              updateStatus(); playBeep('win'); showToast('🔑 Kandang terbuka! Ayam bebas!');
            } else if (cd.toastCd <= 0) {
              showToast(keyItem ? '🔒 Terkunci! Ambil dulu kunci yang berputar' : '🔒 Kandang terkunci! Jawab soal untuk dapat kunci');
              cd.toastCd = 2.5;
            }
          }
        } else if (cd.state === 'opening') {
          cd.t += delta;
          cd.door.rotation.x = -Math.min(cd.t / 0.7, 1) * 1.6;
          cd.lock.visible = false;
          if (cd.t > 0.7) {
            const u = Math.min((cd.t - 0.7) / cd.runDur, 1);
            const d = cd.runLen * (1 - Math.pow(1 - u, 1.5));
            const pos = pathPoint(cd.path, d);
            const hop = u < 1 ? Math.abs(Math.sin(d * 1.9)) * 0.75 : Math.abs(Math.sin(tNow * 2.5)) * 0.15;
            cd.chicken.position.set(pos.x, 0.2 + hop, pos.z);
            cd.chicken.rotation.y = pos.ang;
          }
          if (cd.t >= 0.7 + cd.runDur + 0.6) {
            cd.state = 'done';
            showRescueOverlay();
          }
        }
      }


      if(playerInvulnerable > 0) {
          playerInvulnerable -= delta;
          setPlayerOpacity((Math.floor(playerInvulnerable * 10) % 2 === 0) ? 0.3 : 1.0);
      } else {
          setPlayerOpacity(1.0);
      }

      // Update Kamera Berdasarkan Sudut Offset Horizontal & Vertikal (Spherical Orbit)
      let camRadius = gameState.cellSize * 5.2; // Jarak radius bola dari pemain
      
      let camTargetX = playerMesh.position.x + Math.sin(cameraPitchOffset) * Math.sin(cameraAngleOffset) * camRadius;
      let camTargetY = playerMesh.position.y + 1.5 + Math.cos(cameraPitchOffset) * camRadius;
      let camTargetZ = playerMesh.position.z + Math.sin(cameraPitchOffset) * Math.cos(cameraAngleOffset) * camRadius;
      
      let shakeX = (Math.random() - 0.5) * cameraShake * 4;
      let shakeY = (Math.random() - 0.5) * cameraShake * 4; // Tambahkan getaran vertikal
      let shakeZ = (Math.random() - 0.5) * cameraShake * 4;
      
      if(cameraShake > 0) cameraShake -= delta * 1.5;
      if(cameraShake < 0) cameraShake = 0;

      camera.position.lerp(new THREE.Vector3(camTargetX + shakeX, camTargetY + shakeY, camTargetZ + shakeZ), 0.1);
      camera.lookAt(playerMesh.position.x + shakeX, playerMesh.position.y + 1.5 + shakeY, playerMesh.position.z + shakeZ);

      updateMinimapPlayer();

    } else if (gameState.isPlaying && levelPause) {
      // Dijeda (layar perayaan): tidak ada pembaruan permainan
    } else {
      // SAAT DI LOBI: Kamera Berputar Otomatis
      const time = Date.now() * 0.0003;
      let s = gameState.cellSize;
      let offset = (gameState.mazeSize * s) / 2;
      
      let r = offset * 1.5;
      camera.position.x = offset + Math.cos(time) * r;
      camera.position.z = offset + Math.sin(time) * r;
      camera.position.y = offset * 1.2;
      camera.lookAt(offset, 0, offset);
    }

    updateClouds(delta, (gameState.mazeSize * gameState.cellSize) / 2, (gameState.mazeSize * gameState.cellSize) / 2);
    renderer.render(scene, camera);
  }

  // --- STARTUP ---
  window.onload = () => {
    setGrade(selectedGrade);
    showStart();
    animate();
  };

</script>
</body>
</html>
